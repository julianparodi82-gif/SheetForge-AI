<script>
  const state = {
    mode: 'IDLE',
    plan: null,
    summary: '',
    isBusy: false,
    busyTask: '',
    activeRequestId: 0,
    applyingRequestId: 0,
    cancelledRequestIds: {},
    aiDebug: null
  };

  function setStatus(message, isError) {
    const el = document.getElementById('status');
    const meta = getStatusMeta(message || '', isError);
    el.innerHTML = '<span class="status-wrap"><span class="status-icon ' + meta.iconClass + '">' + meta.icon + '</span><span>' + escapeHtml(message || '') + '</span></span>';
    el.className = isError ? 'status error' : 'status ok';
  }

  function getStatusMeta(message, isError) {
    if (isError) {
      return { icon: '⚠', iconClass: 'error wiggle' };
    }
    if (/Procesando|Aplicando|Editando plan/.test(message)) {
      return { icon: '', iconClass: 'loading' };
    }
    if (/copiado/i.test(message)) {
      return { icon: '📋', iconClass: 'ok pulse' };
    }
    if (/generado|actualizado|limpiados|correctamente/i.test(message)) {
      return { icon: '✅', iconClass: 'ok pulse' };
    }
    return { icon: 'ℹ', iconClass: 'info' };
  }

  function setMode(mode) {
    state.mode = mode;
    const analyzeBtn = document.getElementById('btnAnalyzeEdit');
    const applyBtn = document.getElementById('btnApply');
    if (mode === 'IDLE') {
      analyzeBtn.textContent = 'Analizar';
      applyBtn.disabled = true;
    } else {
      analyzeBtn.textContent = 'Editar';
      applyBtn.disabled = false;
    }
  }

  function setBusy(isBusy, taskLabel) {
    state.isBusy = !!isBusy;
    state.busyTask = isBusy ? (taskLabel || 'acción en curso') : '';
    var disabled = !!isBusy;
    ['btnAnalyzeEdit', 'btnApply', 'btnCopyPlan', 'promptInput']
      .forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (disabled) {
          el.setAttribute('disabled', 'disabled');
        } else if (!(id === 'btnApply' && state.mode === 'IDLE')) {
          el.removeAttribute('disabled');
        }
      });
    if (!disabled && state.mode === 'PLANNED') {
      document.getElementById('btnApply').disabled = false;
    }
    updateCancelApplyVisibility();
  }

  function ensureNotBusy(nextActionLabel) {
    if (!state.isBusy) return true;
    showBusyOverlay('Espera a que termine "' + state.busyTask + '" antes de iniciar "' + nextActionLabel + '".');
    return false;
  }

  function showBusyOverlay(message) {
    document.getElementById('busyOverlayText').textContent = message || 'Espera a que termine la acción anterior para iniciar otra.';
    document.getElementById('busyOverlay').style.display = 'flex';
  }

  function hideBusyOverlay() {
    document.getElementById('busyOverlay').style.display = 'none';
  }

  function updateCancelApplyVisibility() {
    var btn = document.getElementById('btnCancelApply');
    var show = state.isBusy && state.busyTask === 'Aplicando';
    btn.style.display = show ? 'inline-flex' : 'none';
  }

  function formatRunError_(prefix, err) {
    var raw = '';
    if (err && typeof err === 'object') {
      raw = String(err.message || err.details || err.toString() || '');
    } else {
      raw = String(err || '');
    }
    var normalized = raw.replace(/\s+/g, ' ').trim();
    if (/HTTP\s*0|NetworkError|Connection failure/i.test(normalized)) {
      return prefix + ': no se pudo conectar en este momento. Revisa tu conexión e inténtalo nuevamente.';
    }
    return prefix + ': ' + (normalized || 'ocurrió un error inesperado.');
  }

  function renderPlan(plan, summary, aiDebug) {
    state.plan = plan;
    state.summary = summary || '';
    state.aiDebug = aiDebug || null;
    document.getElementById('planJson').innerHTML = formatPlanWithExplanation(plan);
    document.getElementById('summary').innerHTML = formatSummaryWithColors(summary || '');
    renderAiDebug(aiDebug || null);
  }


  function renderAiDebug(aiDebug) {
    var payloadEl = document.getElementById('aiPayload');
    var rawEl = document.getElementById('aiRaw');
    var payloadTimeEl = document.getElementById('aiPayloadTime');
    var rawTimeEl = document.getElementById('aiRawTime');
    if (!payloadEl || !rawEl || !payloadTimeEl || !rawTimeEl) return;
    if (!aiDebug) {
      payloadTimeEl.textContent = '';
      rawTimeEl.textContent = '';
      payloadEl.textContent = '';
      rawEl.textContent = '';
      return;
    }
    var stamp = aiDebug.timestamp ? ('Fecha: ' + aiDebug.timestamp) : '';
    payloadTimeEl.textContent = stamp;
    rawTimeEl.textContent = stamp;
    payloadEl.textContent = aiDebug.payload || '';
    rawEl.textContent = aiDebug.rawResponse || '';
  }


  function formatPlanWithExplanation(plan) {
    if (!plan) return '';
    var jsonLines = JSON.stringify(plan, null, 2).split('\n');
    var formattedLines = [];
    var stepIndex = 1;
    jsonLines.forEach(function(line) {
      var explanation = explainJsonLine(line);
      if (explanation) {
        var connector = getStepConnector(stepIndex);
        formattedLines.push('<span class="line-explain">Paso ' + stepIndex + ': ' + connector + '. ' + escapeHtml(explanation) + '</span>');
        stepIndex += 1;
      }
      formattedLines.push(escapeHtml(line));
    });
    return formattedLines.join('\n');
  }

  function getStepConnector(step) {
    var options = ['Primero', 'Después', 'A continuación', 'Luego', 'Finalmente'];
    return options[(step - 1) % options.length];
  }

  function explainJsonLine(line) {
    var keyMatch = line.match(/"([^"]+)"\s*:/);
    if (!keyMatch) return '';
    var key = keyMatch[1];
    var explanations = {
      actions: 'Estructura principal: la lista "actions" contiene las acciones que se ejecutarán en orden, de arriba hacia abajo.',
      op: 'Tipo de operación: aquí se define el método de Google Sheets que se aplicará (por ejemplo, "setBackgrounds").',
      range: 'Rango objetivo: este campo indica dónde se aplicará la acción dentro de la hoja.',
      sheetName: 'Hoja destino: define en qué hoja se ejecutará esta operación.',
      colors: 'Matriz de colores: debe ser bidimensional y coincidir con el tamaño exacto del rango.',
      rangeA1: 'Rango alternativo: es la misma referencia en notación A1 para ubicar la acción con precisión.',
      backgrounds: 'Matriz de fondos: define colores por celda, fila por fila, para crear patrones o degradados.',
      meta: 'Sección global: contiene configuraciones que afectan la ejecución completa del plan.',
      notes: 'Notas: campo opcional para documentar el objetivo o contexto del plan.',
      dryRun: 'Modo simulación: `false` ejecuta cambios reales; `true` solo simula sin aplicar.',
      safeMode: 'Modo seguro: agrega restricciones para reducir riesgo en operaciones sensibles.',
      version: 'Versión: identifica el formato del plan para compatibilidad futura.',
      sourceA1: 'Rango origen: define desde dónde se toma la información en acciones de copia/movimiento.',
      targetA1: 'Rango destino: define a dónde se envía la información en acciones de copia/movimiento.',
      cell: 'Celda puntual: permite aplicar una acción específica en una celda concreta.',
      color: 'Color único: define un color en hexadecimal (#RRGGBB) para acciones puntuales.',
      values: 'Matriz de valores: contiene los datos que se escribirán en el rango indicado.',
      formula: 'Fórmula: expresa la operación que calculará el contenido de la celda/rango.',
      formulas: 'Matriz de fórmulas: permite aplicar fórmulas diferentes en múltiples celdas.',
      rowIndex: 'Fila inicial: marca el inicio de operaciones estructurales por fila.',
      numRows: 'Cantidad de filas: indica cuántas filas abarca la acción.',
      columnIndex: 'Columna inicial: marca el inicio de operaciones estructurales por columna.',
      numColumns: 'Cantidad de columnas: indica cuántas columnas abarca la acción.',
      fileId: 'Archivo de Drive: identificador del archivo usado por la operación.',
      width: 'Ancho: tamaño horizontal en píxeles para elementos insertados.',
      height: 'Alto: tamaño vertical en píxeles para elementos insertados.',
      name: 'Nombre: texto utilizado al renombrar entidades (hoja/archivo).',
      filename: 'Nombre de archivo: etiqueta final para exportaciones.'
    };
    return explanations[key] || '';
  }

  function formatSummaryWithColors(summary) {
    var escaped = escapeHtml(summary || '');
    escaped = escaped.replace(/\b([A-Za-zÁÉÍÓÚáéíóúñÑ ]+)\s*\((#[0-9a-fA-F]{6})\)/g, function(_, name, hex) {
      return '<span class="color-badge"><span class="color-dot" style="background:' + hex + ';"></span><span style="color:' + hex + ';font-weight:700;">' + escapeHtml(name.trim()) + '</span> (' + hex.toUpperCase() + ')</span>';
    });
    return escaped.replace(/\n/g, '<br>');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }


  document.getElementById('btnAnalyzeEdit').addEventListener('click', function() {
    if (!ensureNotBusy('Analizar/Editar')) return;
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) {
      setStatus('Prompt vacío.', true);
      return;
    }
    const flags = { dryRun: false, safeMode: false };
    var requestId = ++state.activeRequestId;
    setStatus(state.mode === 'IDLE' ? 'Procesando...' : 'Editando plan...', false);
    setBusy(true, state.mode === 'IDLE' ? 'Procesando' : 'Editando plan');
    if (state.mode === 'IDLE') {
      google.script.run.withSuccessHandler(function(result) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary, result.aiDebug || null);
        setMode('PLANNED');
        setStatus('Plan generado.', false);
      }).withFailureHandler(function(err) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        setStatus(formatRunError_('Error al procesar', err), true);
      }).buildPlan(prompt, flags);
    } else {
      google.script.run.withSuccessHandler(function(result) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary, result.aiDebug || null);
        setMode('PLANNED');
        setStatus('Plan actualizado.', false);
      }).withFailureHandler(function(err) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        setStatus(formatRunError_('Error al editar plan', err), true);
      }).editPlan(prompt, state.plan, flags);
    }
  });

  document.getElementById('btnApply').addEventListener('click', function() {
    if (!ensureNotBusy('Aplicar')) return;
    if (!state.plan) {
      setStatus('Sin plan.', true);
      return;
    }
    const flags = { dryRun: false, safeMode: false };
    var requestId = ++state.activeRequestId;
    state.applyingRequestId = requestId;
    setBusy(true, 'Aplicando');
    setStatus('Aplicando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (state.cancelledRequestIds[requestId]) {
        delete state.cancelledRequestIds[requestId];
        return;
      }
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      state.applyingRequestId = 0;
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setMode('IDLE');
      renderPlan(null, '', null);
      document.getElementById('promptInput').value = '';
      setStatus(result.message, false);
    }).withFailureHandler(function(err) {
      if (state.cancelledRequestIds[requestId]) {
        delete state.cancelledRequestIds[requestId];
        return;
      }
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      state.applyingRequestId = 0;
      setStatus(formatRunError_('Error al aplicar', err), true);
    }).applyPlan(state.plan, flags);
  });



  document.getElementById('btnCopyPlan').addEventListener('click', function() {
    if (!ensureNotBusy('Copiar plan')) return;
    var statusEl = document.getElementById('status');
    var previousStatusText = statusEl.textContent || '';
    var previousIsError = (statusEl.className || '').indexOf('error') !== -1;
    var shouldRestore = /Procesando|Aplicando|Editando plan/.test(previousStatusText);

    var planText = document.getElementById('planJson').innerText || '';
    if (!planText.trim()) {
      setStatus('No hay contenido para copiar.', true);
      if (shouldRestore) {
        setTimeout(function() { setStatus(previousStatusText, previousIsError); }, 900);
      }
      return;
    }

    function notifyCopyStatus(ok) {
      setStatus(ok ? 'Plan copiado al portapapeles.' : 'No se pudo copiar el plan.', !ok);
      if (shouldRestore) {
        setTimeout(function() {
          setStatus(previousStatusText, previousIsError);
        }, 900);
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(planText).then(function() {
        notifyCopyStatus(true);
      }).catch(function() {
        notifyCopyStatus(false);
      });
      return;
    }
    var temp = document.createElement('textarea');
    temp.value = planText;
    document.body.appendChild(temp);
    temp.select();
    try {
      document.execCommand('copy');
      notifyCopyStatus(true);
    } catch (e) {
      notifyCopyStatus(false);
    }
    document.body.removeChild(temp);
  });


  document.getElementById('btnBusyOverlayOk').addEventListener('click', hideBusyOverlay);

  document.getElementById('btnCancelApply').addEventListener('click', function() {
    if (!state.applyingRequestId) return;
    state.cancelledRequestIds[state.applyingRequestId] = true;
    state.activeRequestId += 1;
    state.applyingRequestId = 0;
    setBusy(false, '');
    setMode('PLANNED');
    setStatus('Aplicación cancelada por el usuario (se canceló la espera en interfaz).', true);
  });

  setMode('IDLE');
</script>
