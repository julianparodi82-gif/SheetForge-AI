<script>
  const state = {
    mode: 'IDLE',
    plan: null,
    summary: ''
  };

  function setStatus(message, isError) {
    const el = document.getElementById('status');
    el.textContent = message || '';
    el.className = isError ? 'status error' : 'status ok';
  }

  function setMode(mode) {
    state.mode = mode;
    const analyzeBtn = document.getElementById('btnAnalyzeEdit');
    const applyBtn = document.getElementById('btnApply');
    if (mode === 'IDLE') {
      analyzeBtn.textContent = 'Analizar';
      applyBtn.disabled = true;
    } else {
      analyzeBtn.textContent = 'Editar';
      applyBtn.disabled = document.getElementById('dryRun').checked;
    }
  }

  function renderPlan(plan, summary) {
    state.plan = plan;
    state.summary = summary || '';
    document.getElementById('planJson').textContent = formatPlanWithExplanation(plan);
    document.getElementById('summary').textContent = summary || '';
  }

  function formatPlanWithExplanation(plan) {
    if (!plan) return '';
    var jsonLines = JSON.stringify(plan, null, 2).split('\n');
    var explanation = buildPlanExplanation(plan);
    return jsonLines.join('\n') + '\n\nExplicación línea por línea:\n' + explanation.join('\n');
  }

  function buildPlanExplanation(plan) {
    var lines = [];
    lines.push('- plan: contenedor del plan que se ejecutará.');
    if (plan.meta) {
      lines.push('- meta.version: versión del formato del plan.');
      lines.push('- meta.dryRun: indica si la ejecución será solo simulada.');
      lines.push('- meta.safeMode: indica si se restringen operaciones de alto impacto.');
      lines.push('- meta.notes: notas adicionales del plan.');
    }
    if (Array.isArray(plan.actions)) {
      lines.push('- actions: lista de acciones que se ejecutarán en orden.');
      plan.actions.forEach(function(action, index) {
        var parts = [];
        if (action.op) parts.push('operación "' + action.op + '"');
        if (action.sheetName) parts.push('hoja "' + action.sheetName + '"');
        var range = action.rangeA1 || action.sourceA1 || action.targetA1 || action.cell;
        if (range) parts.push('rango "' + range + '"');
        var detail = parts.length ? parts.join(', ') : 'acción definida por el plan.';
        lines.push('- actions[' + index + ']: se ejecutará ' + detail + '.');
      });
    }
    return lines;
  }

  function refreshLogs() {
    google.script.run.withSuccessHandler(function(logs) {
      document.getElementById('logs').textContent = logs.join('\n\n');
    }).getLastLogs(10);
  }

  document.getElementById('btnAnalyzeEdit').addEventListener('click', function() {
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) {
      setStatus('Prompt vacío.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    setStatus('Procesando...', false);
    if (state.mode === 'IDLE') {
      google.script.run.withSuccessHandler(function(result) {
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan generado.', false);
        refreshLogs();
      }).buildPlan(prompt, flags);
    } else {
      google.script.run.withSuccessHandler(function(result) {
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan actualizado.', false);
        refreshLogs();
      }).editPlan(prompt, state.plan, flags);
    }
  });

  document.getElementById('btnApply').addEventListener('click', function() {
    if (!state.plan) {
      setStatus('Sin plan.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    setStatus('Aplicando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setMode('IDLE');
      renderPlan(null, '');
      document.getElementById('promptInput').value = '';
      setStatus(result.message, false);
      refreshLogs();
    }).applyPlan(state.plan, flags);
  });

  document.getElementById('dryRun').addEventListener('change', function() {
    if (state.mode === 'PLANNED') {
      document.getElementById('btnApply').disabled = this.checked;
    }
  });

  document.getElementById('btnScan').addEventListener('click', function() {
    const mode = document.getElementById('scanMode').value;
    setStatus('Escaneando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus(result.message, false);
      refreshLogs();
    }).scanProjectAndUpdateContext({ mode });
  });

  document.getElementById('btnClearLogs').addEventListener('click', function() {
    setStatus('Limpiando registros...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result && result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus('Registros limpiados.', false);
      refreshLogs();
    }).clearLogs();
  });

  setMode('IDLE');
  refreshLogs();
</script>
