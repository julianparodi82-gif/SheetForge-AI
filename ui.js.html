<script>
  const state = {
    mode: 'IDLE',
    plan: null,
    summary: ''
  };

  function setStatus(message, isError) {
    const el = document.getElementById('status');
    el.textContent = message || '';
    el.className = isError ? 'status error' : 'status ok';
  }

  function setMode(mode) {
    state.mode = mode;
    const analyzeBtn = document.getElementById('btnAnalyzeEdit');
    const applyBtn = document.getElementById('btnApply');
    if (mode === 'IDLE') {
      analyzeBtn.textContent = 'Analizar';
      applyBtn.disabled = true;
    } else {
      analyzeBtn.textContent = 'Editar';
      applyBtn.disabled = document.getElementById('dryRun').checked;
    }
  }

  function renderPlan(plan, summary) {
    state.plan = plan;
    state.summary = summary || '';
    document.getElementById('planJson').innerHTML = formatPlanWithExplanation(plan);
    document.getElementById('summary').textContent = summary || '';
  }

  function formatPlanWithExplanation(plan) {
    if (!plan) return '';
    var jsonLines = JSON.stringify(plan, null, 2).split('\n');
    var formattedLines = [];
    jsonLines.forEach(function(line) {
      var explanation = explainJsonLine(line, plan);
      if (explanation) {
        formattedLines.push('<span class="line-explain">' + escapeHtml(explanation) + '</span>');
      }
      formattedLines.push(escapeHtml(line));
    });
    return formattedLines.join('\n');
  }

  function explainJsonLine(line) {
    var keyMatch = line.match(/"([^"]+)"\s*:/);
    if (!keyMatch) return '';
    var key = keyMatch[1];
    var explanations = {
      plan: 'Contiene todo el plan que se ejecutará.',
      meta: 'Configuración general del plan.',
      version: 'Versión del formato del plan.',
      dryRun: 'Si está activado, solo simula sin aplicar cambios.',
      safeMode: 'Si está activado, limita acciones riesgosas.',
      notes: 'Notas adicionales para el plan.',
      actions: 'Lista ordenada de acciones a ejecutar.',
      op: 'Tipo de acción que se ejecutará.',
      sheetName: 'Hoja de cálculo donde se aplica la acción.',
      rangeA1: 'Rango de celdas afectado.',
      sourceA1: 'Rango origen para copiar o mover.',
      targetA1: 'Rango destino para copiar o mover.',
      cell: 'Celda específica de destino.',
      color: 'Color que se aplicará.',
      values: 'Valores que se escribirán.',
      formula: 'Fórmula que se aplicará.',
      formulas: 'Fórmulas que se aplicarán en bloque.',
      rowIndex: 'Fila inicial donde se ejecuta la acción.',
      numRows: 'Cantidad de filas afectadas.',
      columnIndex: 'Columna inicial donde se ejecuta la acción.',
      numColumns: 'Cantidad de columnas afectadas.',
      fileId: 'Identificador del archivo en Drive.',
      width: 'Ancho del elemento en píxeles.',
      height: 'Alto del elemento en píxeles.',
      name: 'Nuevo nombre solicitado.',
      filename: 'Nombre del archivo de salida.'
    };
    return explanations[key] || '';
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function refreshLogs() {
    google.script.run.withSuccessHandler(function(logs) {
      document.getElementById('logs').textContent = logs.join('\n\n');
    }).getLastLogs(10);
  }

  document.getElementById('btnAnalyzeEdit').addEventListener('click', function() {
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) {
      setStatus('Prompt vacío.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    setStatus('Procesando...', false);
    if (state.mode === 'IDLE') {
      google.script.run.withSuccessHandler(function(result) {
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan generado.', false);
        refreshLogs();
      }).buildPlan(prompt, flags);
    } else {
      google.script.run.withSuccessHandler(function(result) {
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan actualizado.', false);
        refreshLogs();
      }).editPlan(prompt, state.plan, flags);
    }
  });

  document.getElementById('btnApply').addEventListener('click', function() {
    if (!state.plan) {
      setStatus('Sin plan.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    setStatus('Aplicando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setMode('IDLE');
      renderPlan(null, '');
      document.getElementById('promptInput').value = '';
      setStatus(result.message, false);
      refreshLogs();
    }).applyPlan(state.plan, flags);
  });

  document.getElementById('dryRun').addEventListener('change', function() {
    if (state.mode === 'PLANNED') {
      document.getElementById('btnApply').disabled = this.checked;
    }
  });

  document.getElementById('btnScan').addEventListener('click', function() {
    const mode = document.getElementById('scanMode').value;
    setStatus('Escaneando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus(result.message, false);
      refreshLogs();
    }).scanProjectAndUpdateContext({ mode });
  });

  document.getElementById('btnClearLogs').addEventListener('click', function() {
    setStatus('Limpiando registros...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (result && result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus('Registros limpiados.', false);
      refreshLogs();
    }).clearLogs();
  });

  setMode('IDLE');
  refreshLogs();
</script>
