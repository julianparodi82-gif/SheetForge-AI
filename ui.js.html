<script>
  const state = {
    mode: 'IDLE',
    plan: null,
    summary: '',
    isBusy: false,
    busyTask: '',
    activeRequestId: 0,
    applyingRequestId: 0,
    cancelledRequestIds: {}
  };
  let scanProgressTimer = null;

  function setStatus(message, isError) {
    const el = document.getElementById('status');
    const meta = getStatusMeta(message || '', isError);
    el.innerHTML = '<span class="status-wrap"><span class="status-icon ' + meta.iconClass + '">' + meta.icon + '</span><span>' + escapeHtml(message || '') + '</span></span>';
    el.className = isError ? 'status error' : 'status ok';
  }

  function getStatusMeta(message, isError) {
    if (isError) {
      return { icon: '⚠', iconClass: 'error wiggle' };
    }
    if (/Procesando|Aplicando|Escaneando|Editando plan/.test(message)) {
      return { icon: '', iconClass: 'loading' };
    }
    if (/copiado/i.test(message)) {
      return { icon: '📋', iconClass: 'ok pulse' };
    }
    if (/generado|actualizado|limpiados|correctamente/i.test(message)) {
      return { icon: '✅', iconClass: 'ok pulse' };
    }
    return { icon: 'ℹ', iconClass: 'info' };
  }

  function setMode(mode) {
    state.mode = mode;
    const analyzeBtn = document.getElementById('btnAnalyzeEdit');
    const applyBtn = document.getElementById('btnApply');
    if (mode === 'IDLE') {
      analyzeBtn.textContent = 'Analizar';
      applyBtn.disabled = true;
    } else {
      analyzeBtn.textContent = 'Editar';
      applyBtn.disabled = document.getElementById('dryRun').checked;
    }
  }

  function setBusy(isBusy, taskLabel) {
    state.isBusy = !!isBusy;
    state.busyTask = isBusy ? (taskLabel || 'acción en curso') : '';
    var disabled = !!isBusy;
    ['btnAnalyzeEdit', 'btnApply', 'btnScan', 'btnClearLogs', 'btnCopyPlan', 'promptInput', 'dryRun', 'safeMode', 'scanMode']
      .forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (disabled) {
          el.setAttribute('disabled', 'disabled');
        } else if (!(id === 'btnApply' && state.mode === 'IDLE')) {
          el.removeAttribute('disabled');
        }
      });
    if (!disabled && state.mode === 'PLANNED') {
      document.getElementById('btnApply').disabled = document.getElementById('dryRun').checked;
    }
    updateCancelApplyVisibility();
  }

  function ensureNotBusy(nextActionLabel) {
    if (!state.isBusy) return true;
    showBusyOverlay('Espera a que termine "' + state.busyTask + '" antes de iniciar "' + nextActionLabel + '".');
    return false;
  }

  function showBusyOverlay(message) {
    document.getElementById('busyOverlayText').textContent = message || 'Espera a que termine la acción anterior para iniciar otra.';
    document.getElementById('busyOverlay').style.display = 'flex';
  }

  function hideBusyOverlay() {
    document.getElementById('busyOverlay').style.display = 'none';
  }

  function updateCancelApplyVisibility() {
    var btn = document.getElementById('btnCancelApply');
    var show = state.isBusy && state.busyTask === 'Aplicando';
    btn.style.display = show ? 'inline-flex' : 'none';
  }

  function renderPlan(plan, summary) {
    state.plan = plan;
    state.summary = summary || '';
    document.getElementById('planJson').innerHTML = formatPlanWithExplanation(plan);
    document.getElementById('summary').innerHTML = formatSummaryWithColors(summary || '');
  }

  function formatPlanWithExplanation(plan) {
    if (!plan) return '';
    var blocks = buildPlanBlockSummaries(plan);
    var blockLines = blocks.map(function(text, index) {
      return '<span class="line-explain">Bloque ' + (index + 1) + ': ' + escapeHtml(text) + '</span>';
    });
    blockLines.push(escapeHtml(JSON.stringify(plan, null, 2)));
    return blockLines.join('\n');
  }

  function buildPlanBlockSummaries(plan) {
    if (!plan) return [];
    var blocks = [];
    if (plan.meta) {
      blocks.push('Configuración general: versión ' + (plan.meta.version || '1.0') + ', dryRun=' + !!plan.meta.dryRun + ', safeMode=' + !!plan.meta.safeMode + '.');
    }
    if (Array.isArray(plan.actions) && plan.actions.length) {
      blocks.push('Ejecución: ' + plan.actions.length + ' acción(es) agrupadas en orden de aplicación.');
      plan.actions.forEach(function(action, index) {
        var location = action.rangeA1 || action.targetA1 || action.sourceA1 || action.cell || 'sin rango';
        blocks.push('Acción ' + (index + 1) + ': ' + (action.op || 'acción') + ' en ' + (action.sheetName || 'hoja activa') + ' (' + location + ').');
      });
    }
    return blocks;
  }

  function formatSummaryWithColors(summary) {
    var escaped = escapeHtml(summary || '');
    escaped = escaped.replace(/\b([A-Za-zÁÉÍÓÚáéíóúñÑ ]+)\s*\((#[0-9a-fA-F]{6})\)/g, function(_, name, hex) {
      return '<span class="color-badge"><span class="color-dot" style="background:' + hex + ';"></span><span style="color:' + hex + ';font-weight:700;">' + escapeHtml(name.trim()) + '</span> (' + hex.toUpperCase() + ')</span>';
    });
    return escaped.replace(/\n/g, '<br>');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function refreshLogs() {
    google.script.run.withSuccessHandler(function(logs) {
      document.getElementById('logs').innerHTML = formatLogs(logs);
    }).getLastLogs(10);
  }

  function formatLogs(logs) {
    return (logs || []).map(function(entry) {
      var lines = String(entry || '').split('\n');
      return lines.map(function(line) {
        if (line.indexOf('Fecha:') === 0) {
          return '<span class="log-date">' + escapeHtml(line) + '</span>';
        }
        if (line.indexOf('Estado:') === 0) {
          var status = line.replace('Estado:', '').trim();
          var statusClass = status === 'Aplicado' ? 'log-status-ok' : 'log-status-error';
          return '<span class="' + statusClass + '"><span class="log-label">Estado:</span> ' + escapeHtml(status) + '</span>';
        }
        if (line.indexOf('Mensaje:') === 0) {
          return '<span class="log-label">Mensaje:</span> ' + escapeHtml(line.replace('Mensaje:', '').trim());
        }
        if (line.indexOf('Resumen:') === 0) {
          return '<span class="log-label">Resumen:</span> ' + escapeHtml(line.replace('Resumen:', '').trim());
        }
        return escapeHtml(line);
      }).join('<br>');
    }).join('<br><br>');
  }

  document.getElementById('btnAnalyzeEdit').addEventListener('click', function() {
    if (!ensureNotBusy('Analizar/Editar')) return;
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) {
      setStatus('Prompt vacío.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    var requestId = ++state.activeRequestId;
    setStatus(state.mode === 'IDLE' ? 'Procesando...' : 'Editando plan...', false);
    setBusy(true, state.mode === 'IDLE' ? 'Procesando' : 'Editando plan');
    if (state.mode === 'IDLE') {
      google.script.run.withSuccessHandler(function(result) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan generado.', false);
        refreshLogs();
      }).withFailureHandler(function(err) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        setStatus('Error al procesar: ' + (err && err.message ? err.message : err), true);
      }).buildPlan(prompt, flags);
    } else {
      google.script.run.withSuccessHandler(function(result) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        if (result.error) {
          setStatus(result.error, true);
          return;
        }
        renderPlan(result.plan, result.summary);
        setMode('PLANNED');
        setStatus('Plan actualizado.', false);
        refreshLogs();
      }).withFailureHandler(function(err) {
        if (requestId !== state.activeRequestId) return;
        setBusy(false, '');
        setStatus('Error al editar plan: ' + (err && err.message ? err.message : err), true);
      }).editPlan(prompt, state.plan, flags);
    }
  });

  document.getElementById('btnApply').addEventListener('click', function() {
    if (!ensureNotBusy('Aplicar')) return;
    if (!state.plan) {
      setStatus('Sin plan.', true);
      return;
    }
    const flags = {
      dryRun: document.getElementById('dryRun').checked,
      safeMode: document.getElementById('safeMode').checked
    };
    var requestId = ++state.activeRequestId;
    state.applyingRequestId = requestId;
    setBusy(true, 'Aplicando');
    setStatus('Aplicando...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (state.cancelledRequestIds[requestId]) {
        delete state.cancelledRequestIds[requestId];
        return;
      }
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      state.applyingRequestId = 0;
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setMode('IDLE');
      renderPlan(null, '');
      document.getElementById('promptInput').value = '';
      setStatus(result.message, false);
      refreshLogs();
    }).withFailureHandler(function(err) {
      if (state.cancelledRequestIds[requestId]) {
        delete state.cancelledRequestIds[requestId];
        return;
      }
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      state.applyingRequestId = 0;
      setStatus('Error al aplicar: ' + (err && err.message ? err.message : err), true);
    }).applyPlan(state.plan, flags);
  });

  document.getElementById('dryRun').addEventListener('change', function() {
    if (state.mode === 'PLANNED') {
      document.getElementById('btnApply').disabled = this.checked;
    }
  });

  document.getElementById('btnScan').addEventListener('click', function() {
    if (!ensureNotBusy('Escanear proyecto')) return;
    const mode = document.getElementById('scanMode').value;
    var requestId = ++state.activeRequestId;
    setBusy(true, 'Escaneando proyecto');
    startScanProgress(mode);
    google.script.run.withSuccessHandler(function(result) {
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      stopScanProgress();
      if (result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus(result.message, false);
      refreshLogs();
    }).withFailureHandler(function(err) {
      if (requestId !== state.activeRequestId) return;
      stopScanProgress();
      setBusy(false, '');
      setStatus('Error al escanear: ' + (err && err.message ? err.message : err), true);
    }).scanProjectAndUpdateContext({ mode });
  });

  function startScanProgress(mode) {
    stopScanProgress();
    var steps = mode === 'full'
      ? [
          'Escaneando: leyendo estructura general del archivo...',
          'Escaneando: revisando hojas, tamaños y rangos usados...',
          'Escaneando: analizando fórmulas, formatos y validaciones...',
          'Escaneando: consolidando contexto completo para la IA...'
        ]
      : [
          'Escaneando: leyendo estructura base del archivo...',
          'Escaneando: identificando hojas y rangos principales...',
          'Escaneando: guardando contexto rápido para la IA...'
        ];
    var index = 0;
    setStatus(steps[index], false);
    scanProgressTimer = setInterval(function() {
      index = (index + 1) % steps.length;
      setStatus(steps[index], false);
    }, 1200);
  }

  function stopScanProgress() {
    if (scanProgressTimer) {
      clearInterval(scanProgressTimer);
      scanProgressTimer = null;
    }
  }

  document.getElementById('btnCopyPlan').addEventListener('click', function() {
    if (!ensureNotBusy('Copiar plan')) return;
    var statusEl = document.getElementById('status');
    var previousStatusText = statusEl.textContent || '';
    var previousIsError = (statusEl.className || '').indexOf('error') !== -1;
    var shouldRestore = /Procesando|Aplicando|Escaneando|Editando plan/.test(previousStatusText);

    var planText = document.getElementById('planJson').innerText || '';
    if (!planText.trim()) {
      setStatus('No hay contenido para copiar.', true);
      if (shouldRestore) {
        setTimeout(function() { setStatus(previousStatusText, previousIsError); }, 900);
      }
      return;
    }

    function notifyCopyStatus(ok) {
      setStatus(ok ? 'Plan copiado al portapapeles.' : 'No se pudo copiar el plan.', !ok);
      if (shouldRestore) {
        setTimeout(function() {
          setStatus(previousStatusText, previousIsError);
        }, 900);
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(planText).then(function() {
        notifyCopyStatus(true);
      }).catch(function() {
        notifyCopyStatus(false);
      });
      return;
    }
    var temp = document.createElement('textarea');
    temp.value = planText;
    document.body.appendChild(temp);
    temp.select();
    try {
      document.execCommand('copy');
      notifyCopyStatus(true);
    } catch (e) {
      notifyCopyStatus(false);
    }
    document.body.removeChild(temp);
  });

  document.getElementById('btnClearLogs').addEventListener('click', function() {
    if (!ensureNotBusy('Limpiar registros')) return;
    var requestId = ++state.activeRequestId;
    setBusy(true, 'Limpiando registros');
    setStatus('Limpiando registros...', false);
    google.script.run.withSuccessHandler(function(result) {
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      if (result && result.error) {
        setStatus(result.error, true);
        return;
      }
      setStatus('Registros limpiados.', false);
      refreshLogs();
    }).withFailureHandler(function(err) {
      if (requestId !== state.activeRequestId) return;
      setBusy(false, '');
      setStatus('Error al limpiar registros: ' + (err && err.message ? err.message : err), true);
    }).clearLogs();
  });

  document.getElementById('btnBusyOverlayOk').addEventListener('click', hideBusyOverlay);

  document.getElementById('btnCancelApply').addEventListener('click', function() {
    if (!state.applyingRequestId) return;
    state.cancelledRequestIds[state.applyingRequestId] = true;
    state.activeRequestId += 1;
    state.applyingRequestId = 0;
    setBusy(false, '');
    setMode('PLANNED');
    setStatus('Aplicación cancelada por el usuario (se canceló la espera en interfaz).', true);
  });

  setMode('IDLE');
  refreshLogs();
</script>
