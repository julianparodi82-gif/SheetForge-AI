<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Inter', Arial, sans-serif; color: #0f2d1f; background: #f5fbf4; }
      .container { padding: 14px; }
      h2 { color: #1b5e20; margin: 0 0 12px; font-size: 18px; }
      textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid #a5d6a7; border-radius: 10px; background: #fff; }
      button { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
      button.primary { background: #1b5e20; color: #fff; box-shadow: 0 2px 6px rgba(27,94,32,0.2); }
      button.secondary { background: #c8e6c9; color: #1b5e20; }
      button:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }
      .row { display: flex; gap: 12px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
      .buttons { justify-content: center; gap: 18px; }
      .panel { border: 1px solid #c8e6c9; padding: 8px; border-radius: 10px; margin: 10px 0; background: #ffffff; }
      .panel summary { cursor: pointer; font-weight: 600; color: #1b5e20; list-style: none; display: flex; justify-content: space-between; align-items: center; }
      .panel summary::-webkit-details-marker { display: none; }
      .panel summary::after { content: '▸'; font-size: 14px; color: #2e7d32; transition: transform 0.2s ease; }
      .panel[open] summary::after { transform: rotate(90deg); }
      .panel-content { padding-top: 8px; }
      .status.ok { color: #1b5e20; }
      .status.error { color: #b71c1c; }
      label { font-size: 12px; font-weight: 600; color: #2e5a3a; }
      select, input[type=checkbox] { margin-right: 6px; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      .scrollable { max-height: 220px; overflow: auto; }
      .field-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>SheetForge AI — Operador IA</h2>
      <textarea id="promptInput" placeholder="Escribe instrucciones o comandos..."></textarea>
      <div class="row buttons">
        <button id="btnAnalyzeEdit" class="primary">Analizar</button>
        <button id="btnApply" class="secondary" disabled>Aplicar</button>
      </div>
      <div class="row field-group">
        <label><input type="checkbox" id="dryRun" checked> Simulación (Dry Run)</label>
        <label><input type="checkbox" id="safeMode" checked> Modo seguro</label>
        <label>Modo de escaneo
          <select id="scanMode">
            <option value="quick">Rápido</option>
            <option value="full">Completo</option>
          </select>
        </label>
        <button id="btnScan" class="secondary">Escanear proyecto</button>
      </div>
      <details class="panel" open>
        <summary>Resumen profesional</summary>
        <div class="panel-content">
          <pre id="summary" class="scrollable"></pre>
        </div>
      </details>
      <details class="panel" open>
        <summary>Plan JSON</summary>
        <div class="panel-content">
          <pre id="planJson" class="scrollable"></pre>
        </div>
      </details>
      <details class="panel" open>
        <summary>Estado</summary>
        <div class="panel-content">
          <div id="status" class="status"></div>
        </div>
      </details>
      <details class="panel" open>
        <summary>Últimos registros</summary>
        <div class="panel-content">
          <pre id="logs" class="scrollable"></pre>
        </div>
      </details>
    </div>
    <?!= include('ui.js'); ?>
  </body>
</html>
