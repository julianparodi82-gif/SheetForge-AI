<script>
  function setStatus(message, isError) {
    const el = document.getElementById('status');
    el.textContent = message || '';
    el.style.color = isError ? '#b71c1c' : '#1b5e20';
  }

  function loadSettings() {
    google.script.run.withSuccessHandler(function(settings) {
      const lang = (settings.language || '').toLowerCase();
      document.getElementById('language').value = lang.startsWith('en') ? 'en' : 'es';
      document.getElementById('aiEndpoint').value = settings.aiEndpoint || '';
      document.getElementById('aiApiKey').value = settings.aiApiKey || '';
      renderSafeOps(settings.safeBlockedOps || []);
    }).getSettings();
  }

  const SAFE_OPS = [
    { op: 'deleteSheet', label: 'Eliminar hoja (deleteSheet)' },
    { op: 'renameFile', label: 'Renombrar archivo (renameFile)' },
    { op: 'deleteRows', label: 'Eliminar filas (deleteRows)' },
    { op: 'clearContent', label: 'Limpiar contenido (clearContent)' }
  ];

  function renderSafeOps(selectedOps) {
    const container = document.getElementById('safeOpsList');
    container.innerHTML = '';
    SAFE_OPS.forEach(function(item) {
      const row = document.createElement('label');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.marginTop = '6px';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = item.op;
      input.checked = selectedOps.indexOf(item.op) !== -1;
      row.appendChild(input);
      const text = document.createElement('span');
      text.textContent = item.label;
      row.appendChild(text);
      container.appendChild(row);
    });
  }

  document.getElementById('toggleKey').addEventListener('change', function() {
    const input = document.getElementById('aiApiKey');
    input.type = this.checked ? 'text' : 'password';
  });

  document.getElementById('btnSave').addEventListener('click', function() {
    const button = this;
    button.disabled = true;
    setStatus('Guardando...', false);
    let timeoutId = null;
    const safeBlockedOps = Array.from(document.querySelectorAll('#safeOpsList input[type="checkbox"]:checked'))
      .map((input) => input.value);
    const payload = {
      language: document.getElementById('language').value,
      aiEndpoint: document.getElementById('aiEndpoint').value.trim(),
      aiApiKey: document.getElementById('aiApiKey').value.trim(),
      safeBlockedOps: safeBlockedOps
    };
    try {
      timeoutId = setTimeout(function() {
        setStatus('No se recibió respuesta al guardar. Reabre el diálogo e intenta de nuevo.', true);
        button.disabled = false;
      }, 10000);
      google.script.run.withSuccessHandler(function(result) {
        if (timeoutId) clearTimeout(timeoutId);
        if (result && result.settings) {
          document.getElementById('language').value = result.settings.language || 'es';
          document.getElementById('aiEndpoint').value = result.settings.aiEndpoint || '';
          document.getElementById('aiApiKey').value = result.settings.aiApiKey || '';
          renderSafeOps(result.settings.safeBlockedOps || []);
        } else {
          loadSettings();
        }
        setStatus(result && result.message ? result.message : 'Clave guardada correctamente.', false);
        button.disabled = false;
      }).withFailureHandler(function(error) {
        if (timeoutId) clearTimeout(timeoutId);
        setStatus('Error al guardar: ' + (error && error.message ? error.message : 'desconocido'), true);
        button.disabled = false;
      }).saveSettings(payload);
    } catch (error) {
      if (timeoutId) clearTimeout(timeoutId);
      setStatus('Error al iniciar el guardado: ' + (error && error.message ? error.message : 'desconocido'), true);
      button.disabled = false;
    }
  });

  loadSettings();
</script>
